name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript Engine
        run: npm run build

      - name: Verify CLI Executable
        run: node ./dist/cli.js --help

      - name: Publish to npm Registry
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Checking if retrofit-sdk-gen@$CURRENT_VER is published on npm..."
          if npm view retrofit-sdk-gen@$CURRENT_VER version >/dev/null 2>&1; then
            echo "⏩ Version $CURRENT_VER is already published on npm. Skipping publish."
          else
            echo "🚀 Publishing version $CURRENT_VER to npm registry..."
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

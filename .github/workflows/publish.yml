name: Publish to npm

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish to npm Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript Engine
        run: npm run build

      - name: Verify CLI Executable
        run: node ./dist/cli.js --help

      - name: Inspect Package & Version
        id: pkg_info
        run: |
          PACKAGE_VER=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VER" >> $GITHUB_OUTPUT
          echo "Package Version: $PACKAGE_VER"

          if npm view retrofit-sdk-gen@$PACKAGE_VER version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "⏩ retrofit-sdk-gen@$PACKAGE_VER is already published on npm."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "🚀 New version retrofit-sdk-gen@$PACKAGE_VER detected!"
          fi

      - name: Publish to npm Registry
        if: steps.pkg_info.outputs.published == 'false' && env.NODE_AUTH_TOKEN != ''
        run: |
          echo "Publishing retrofit-sdk-gen@${{ steps.pkg_info.outputs.version }} to npm..."
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Auto-Create Git Tag & GitHub Release
        if: steps.pkg_info.outputs.published == 'false' && env.NODE_AUTH_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "v${{ steps.pkg_info.outputs.version }}"
        run: |
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating and pushing Git tag $TAG_NAME..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || echo "Tag may already exist on remote"
          fi
          echo "Ensuring GitHub Release exists for $TAG_NAME..."
          gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes || echo "Release already exists"
